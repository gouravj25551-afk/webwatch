name: Run WebWatch monitors

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: webwatch-monitor-scheduler
  cancel-in-progress: false

jobs:
  run-due-monitors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger due monitor checks
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 240 \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://webwatch-gamma.vercel.app/api/cron
